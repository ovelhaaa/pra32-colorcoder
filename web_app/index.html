<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRA32-U2 Web Synth</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Additional Layout CSS for Desktop / Mobile Panels */
        * { box-sizing: border-box; touch-action: pan-y; }
        body, html { margin: 0; padding: 0; height: 100%; background: #0E0E0E; color: #E0E0E0; overflow: hidden; }

        .pra-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 0;
            padding: 0;
        }

        .pra-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 0;
        }

        .pra-main-controls {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Mobile Tabs */
        .pra-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 10px 24px 0 24px;
            display: none;
        }

        .pra-tab-btn {
            flex: 1;
            min-width: 60px;
            background: #141414;
            color: #555;
            border: 1px solid #2A2A2A;
            border-bottom: none;
            padding: 8px 4px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            text-transform: uppercase;
        }

        .pra-tab-btn.active {
            background: #1C1C1C;
            color: #E8A020;
            border-color: #333;
        }

        /* Panels Area */
        .pra-panels-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            align-content: start;
        }

        .pra-panel {
            background: #141414;
            border: 1px solid #2A2A2A;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pra-panel-header {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            border-bottom: 1px solid #2A2A2A;
            padding-bottom: 8px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pra-panel-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }

        /* Responsive Overrides */
        @media (max-width: 900px) {
            .pra-tabs {
                display: flex;
            }
            .pra-panels-container {
                display: flex;
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }
            .pra-panel {
                display: none;
                border-radius: 0 0 8px 8px;
                border-top: 1px solid #333;
            }
            .pra-panel.active {
                display: flex;
            }
        }

        /* Full Screen Overlay */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(14, 14, 14, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mutate-btn {
            background: none;
            border: 1px solid #E8A020;
            color: #E8A020;
            padding: 4px 8px;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mutate-btn:hover { background: rgba(232, 160, 32, 0.1); }
        .mutate-btn:active { background: #E8A020; color: #141414; }

    </style>
</head>
<body>

<div id="start-overlay">
    <button class="pra-init-btn" id="start-btn" style="margin: 0; padding: 20px 40px; font-size: 14px;">▶ INIT AUDIO ENGINE</button>
</div>

<div class="pra-root">
    <div class="pra-header">
        <div class="pra-logo">PRA32-U2 <span>/ SYNTHESIZER</span></div>
        <div class="pra-status-bar">
            <button class="mutate-btn" id="circuitBendBtn">CHAOS</button>
            <div class="pra-status-dot" id="status-dot"></div>
            <span class="pra-status-text" id="status-text">OFFLINE</span>
        </div>
    </div>

    <div class="pra-body">
        <div class="pra-preset-row">
            <span class="pra-preset-label">PRESET</span>
            <select class="pra-preset-select" id="presetSelect">
                <option value="-1">— Custom —</option>
            </select>
        </div>

        <div class="pra-main-controls">
            <div class="pra-tabs" id="tabsContainer"></div>
            <div class="pra-panels-container" id="tabContentsContainer"></div>
        </div>

        <div class="pra-kbd-section" style="margin-top: 0;">
            <div class="pra-oct-row">
                <span class="pra-oct-label">KEYBOARD</span>
                <div class="pra-oct-controls" id="octave-controls">
                    <button class="pra-oct-btn" id="octave-down">OCT −</button>
                    <span class="pra-oct-disp" id="octave-display">C4</span>
                    <button class="pra-oct-btn" id="octave-up">OCT +</button>
                </div>
            </div>
            <div class="pra-keyboard" id="keyboard"></div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
