name: Build Windows Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Validate factory preset mirrors
      run: python scripts/validate_factory_presets.py

    - name: Configure CMake (VS2022 x64, JUCE 8.0.0)
      run: cmake -S juce_plugin -B juce_plugin/build -G "Visual Studio 17 2022" -A x64 -DPRA32_BUILD_TESTS=ON

    - name: Build Release
      run: cmake --build juce_plugin/build --config Release --target PRA32ColorcoderPlugin_Standalone PRA32ColorcoderPlugin_VST3 pra32_param_logic_tests pra32_midi_state_tests pra32_engine_tests pra32_resampler_tests pra32_plugin_tests -j 4

    - name: Run regression tests
      run: ctest --test-dir juce_plugin/build -C Release --output-on-failure

    - name: Fetch pinned pluginval 1.0.4
      shell: pwsh
      run: |
        Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
        $expectedHash = 'C08E61CE3B96DB41636F8EC7E76F4C7E2C13EBDAC7FA1B5A1F52B4F32EC715AB'
        if ((Get-FileHash pluginval.zip -Algorithm SHA256).Hash -ne $expectedHash) { throw 'pluginval checksum mismatch' }
        Expand-Archive pluginval.zip -DestinationPath pluginval

    # Level 5 is pluginval's documented minimum host compatibility bar.
    # GUI checks remain enabled. Failure prevents packaging and artifact upload.
    - name: Validate VST3 with pluginval (strictness 5)
      shell: pwsh
      run: |
        $validator = (Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
        $plugin = (Get-ChildItem juce_plugin/build/PRA32ColorcoderPlugin_artefacts/Release/VST3 -Filter '*.vst3' | Select-Object -First 1).FullName
        if (-not $validator -or -not $plugin) { throw 'Missing validator or VST3 bundle' }
        New-Item -ItemType Directory -Path pluginval-logs -Force | Out-Null
        $arguments = '--strictness-level 5 --timeout-ms 180000 --sample-rates 44100,48000,88200,96000,176400,192000 --block-sizes 1,16,32,64,128,256,512,1024,2048 --output-dir pluginval-logs --validate "' + $plugin + '"'
        # pluginval is a Windows GUI-subsystem executable: wait explicitly and
        # inspect the actual process exit code rather than stale LASTEXITCODE.
        $validation = Start-Process -FilePath $validator -ArgumentList $arguments -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput pluginval-logs/stdout.log -RedirectStandardError pluginval-logs/stderr.log
        Get-Content pluginval-logs/stdout.log
        if ($validation.ExitCode -ne 0) { throw "pluginval failed: $($validation.ExitCode)" }

    - name: Package validated beta candidate
      shell: pwsh
      run: |
        $package = 'Tonecoder-TC32-0.9.0-beta.1-Windows-x64'
        New-Item -ItemType Directory -Path $package | Out-Null
        Copy-Item juce_plugin/build/PRA32ColorcoderPlugin_artefacts/Release/VST3/* $package -Recurse
        Copy-Item juce_plugin/build/PRA32ColorcoderPlugin_artefacts/Release/Standalone/* $package -Recurse
        Copy-Item TESTING.md,LICENSE $package
        Copy-Item juce_plugin/README.md "$package/README.md"
        "Tonecoder TC-32 0.9.0-beta.1`nCommit: $env:GITHUB_SHA`nWindows 2022 / VS2022 x64 Release / JUCE 8.0.0 / pluginval 1.0.4 strictness 5" | Set-Content "$package/BUILD.txt"
        Compress-Archive "$package/*" "$package.zip"

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tonecoder-TC32-Windows-VST3
        path: juce_plugin/build/PRA32ColorcoderPlugin_artefacts/Release/VST3/
        if-no-files-found: error

    - name: Upload Standalone Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tonecoder-TC32-Windows-Standalone
        path: juce_plugin/build/PRA32ColorcoderPlugin_artefacts/Release/Standalone/
        if-no-files-found: error

    - name: Upload beta candidate package
      uses: actions/upload-artifact@v4
      with:
        name: Tonecoder-TC32-0.9.0-beta.1-Windows-x64
        path: Tonecoder-TC32-0.9.0-beta.1-Windows-x64.zip
        if-no-files-found: error

    - name: Upload validation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Tonecoder-TC32-validation-logs
        path: |
          pluginval-logs/
          juce_plugin/build/Testing/Temporary/LastTest.log
